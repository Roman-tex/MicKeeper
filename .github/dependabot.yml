# Keeps the GitHub Actions used by the workflows current. Old action versions
# are retired by GitHub (for example when their Node runtime is deprecated);
# Dependabot opens a pull request for each update so CI can verify it first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

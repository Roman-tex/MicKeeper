name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: xcode-27
    env:
      # The app icon is an Icon Composer 27 document; older actool cannot read it.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Tests
        run: swift test
      - name: Build and verify universal DMG
        run: ./scripts/package-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: MicKeeper-build
          path: |
            dist/MicKeeper.dmg
            dist/MicKeeper.dmg.sha256
          if-no-files-found: error
